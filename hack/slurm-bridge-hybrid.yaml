---
configFiles:
  gres.conf: |
    Name=gpu Type=gpu-example File=/dev/tty[10-13] Count=4
  topology.yaml: |
    ---
    - topology: topo-switch
      cluster_default: true
      tree:
        switches:
          - switch: sw_root
            children: s[1-2]
          - switch: s1
          - switch: s2
controller:
  extraConf: |
    GresTypes=gpu
    MCSPlugin=mcs/label
    MCSParameters=ondemand,ondemandselect
nodesets:
  slinky:
    enabled: false
  slurm-bridge:
    enabled: true
    scalingMode: DaemonSet
    slurmd:
      env: []
      image:
        repository: ghcr.io/slinkyproject/slurmd
        tag: 25.11-ubuntu24.04
      args: []
      resources: {}
      volumeMounts: []
    logfile:
      image:
        repository: docker.io/library/alpine
        tag: latest
      resources: {}
    extraConf: Gres=gpu:gpu-example:4
    partition:
      enabled: true
    podSpec:
      nodeSelector:
        scheduler.slinky.slurm.net/slurm-bridge: worker
        kubernetes.io/os: linux
      tolerations:
        - key: slinky.slurm.net/managed-node
          operator: Equal
          value: slurm-bridge-scheduler
          effect: NoExecute
