---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-sleep-large
  namespace: slurm-bridge
spec:
  completions: 3
  parallelism: 2
  template:
    metadata:
      annotations:
        slurmjob.slinky.slurm.net/job-name: job-sleep-large
    spec:
      schedulerName: slurm-bridge-scheduler
      containers:
        - name: sleep
          image: busybox:stable
          command: [sh, -c, sleep 3]
          resources:
            requests:
              cpu: '1'
              memory: 100Mi
            limits:
              cpu: '1'
              memory: 100Mi
      restartPolicy: Never
