#
# Mounts the nvml-mock PCI tree (GPUs 0-3 on NUMA node 0, 4-7 on NUMA node 1)
# for NVIDIA_DRA_SYSFS_ROOT in mock-values.yaml.
  - op: add
    path: /spec/template/spec/volumes/-
    value:
      name: nvml-mock-sysfs
      hostPath:
        path: /var/lib/nvml-mock/sys
        type: Directory
  - op: add
    path: /spec/template/spec/containers/0/volumeMounts/-
    value:
      name: nvml-mock-sysfs
      mountPath: /nvml-mock-sysfs
      readOnly: true
