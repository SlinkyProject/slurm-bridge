apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: slurm-bridge-controller-runtime
  namespace: monitoring
spec:
  endpoints:
    - interval: 15s
      path: /metrics
      port: metrics
  namespaceSelector:
    matchNames:
      - slurm
  selector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - admission
          - controllers
      - key: app.kubernetes.io/instance
        operator: In
        values:
          - slurm-bridge
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: slurm-bridge-scheduler
  namespace: monitoring
spec:
  endpoints:
    - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      interval: 15s
      path: /metrics
      port: https-metrics
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
  namespaceSelector:
    matchNames:
      - slurm
  selector:
    matchLabels:
      app.kubernetes.io/component: scheduler
      app.kubernetes.io/instance: slurm-bridge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: slurm-bridge-prometheus-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: slurm-bridge-metrics-reader
subjects:
  - kind: ServiceAccount
    name: prometheus-kube-prometheus-prometheus
    namespace: monitoring
