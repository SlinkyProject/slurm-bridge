alertmanager:
  enabled: false

defaultRules:
  create: false

# Enable this when a local dashboard is useful. The stack configures Prometheus
# as Grafana's default data source.
grafana:
  enabled: false

kubeApiServer:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
kubeStateMetrics:
  enabled: false
kubelet:
  enabled: false
nodeExporter:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 24h
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
