# SPDX-License-Identifier: Apache-2.0
fullnameOverride: dracpu

image:
  repository: registry.k8s.io/dra-driver-cpu/dra-driver-cpu
  pullPolicy: IfNotPresent

podLabels:
  app: dracpu

args:
  logLevel: 4
  exposePCIeRoots: false

driverConfig:
  cpuDeviceMode: grouped
  groupBy: socket
  allocator: external
  reservedCPUs: ''

nodeSelector:
  scheduler.slinky.slurm.net/slurm-bridge: worker

tolerations:
  - key: slinky.slurm.net/managed-node
    operator: Equal
    value: slurm-bridge-scheduler
    effect: NoExecute
