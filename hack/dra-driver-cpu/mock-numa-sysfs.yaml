#
# Two sockets, each one NUMA node with four CPUs and no SMT, matching the
# nvml-mock a100 PCIe layout.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dra-driver-cpu-mock-numa-sysfs
  namespace: kube-system
data:
  sysfs-overlay.yaml: |
    /sys/devices/system/cpu/online: "0-7\n"
    /sys/devices/system/cpu/smt/control: "off\n"
    /sys/devices/pci0000:00/pci_bus/0000:00/cpulistaffinity: "0-3\n"
    /sys/devices/system/node/node0/cpulist: "0-3\n"
    /sys/devices/system/node/node0/distance: "10 20\n"
    /sys/devices/pci0000:80/pci_bus/0000:80/cpulistaffinity: "4-7\n"
    /sys/devices/system/node/node1/cpulist: "4-7\n"
    /sys/devices/system/node/node1/distance: "20 10\n"
    /sys/devices/system/cpu/cpu0/node0: ""
    /sys/devices/system/cpu/cpu0/topology/physical_package_id: "0\n"
    /sys/devices/system/cpu/cpu0/topology/core_id: "0\n"
    /sys/devices/system/cpu/cpu0/topology/cluster_id: "0\n"
    /sys/devices/system/cpu/cpu0/cache/index3/level: "3\n"
    /sys/devices/system/cpu/cpu0/cache/index3/id: "0\n"
    /sys/devices/system/cpu/cpu0/cache/index3/shared_cpu_list: "0-3\n"
    /sys/devices/system/cpu/cpu1/node0: ""
    /sys/devices/system/cpu/cpu1/topology/physical_package_id: "0\n"
    /sys/devices/system/cpu/cpu1/topology/core_id: "1\n"
    /sys/devices/system/cpu/cpu1/topology/cluster_id: "0\n"
    /sys/devices/system/cpu/cpu1/cache/index3/level: "3\n"
    /sys/devices/system/cpu/cpu1/cache/index3/id: "0\n"
    /sys/devices/system/cpu/cpu1/cache/index3/shared_cpu_list: "0-3\n"
    /sys/devices/system/cpu/cpu2/node0: ""
    /sys/devices/system/cpu/cpu2/topology/physical_package_id: "0\n"
    /sys/devices/system/cpu/cpu2/topology/core_id: "2\n"
    /sys/devices/system/cpu/cpu2/topology/cluster_id: "0\n"
    /sys/devices/system/cpu/cpu2/cache/index3/level: "3\n"
    /sys/devices/system/cpu/cpu2/cache/index3/id: "0\n"
    /sys/devices/system/cpu/cpu2/cache/index3/shared_cpu_list: "0-3\n"
    /sys/devices/system/cpu/cpu3/node0: ""
    /sys/devices/system/cpu/cpu3/topology/physical_package_id: "0\n"
    /sys/devices/system/cpu/cpu3/topology/core_id: "3\n"
    /sys/devices/system/cpu/cpu3/topology/cluster_id: "0\n"
    /sys/devices/system/cpu/cpu3/cache/index3/level: "3\n"
    /sys/devices/system/cpu/cpu3/cache/index3/id: "0\n"
    /sys/devices/system/cpu/cpu3/cache/index3/shared_cpu_list: "0-3\n"
    /sys/devices/system/cpu/cpu4/node1: ""
    /sys/devices/system/cpu/cpu4/topology/physical_package_id: "1\n"
    /sys/devices/system/cpu/cpu4/topology/core_id: "0\n"
    /sys/devices/system/cpu/cpu4/topology/cluster_id: "0\n"
    /sys/devices/system/cpu/cpu4/cache/index3/level: "3\n"
    /sys/devices/system/cpu/cpu4/cache/index3/id: "1\n"
    /sys/devices/system/cpu/cpu4/cache/index3/shared_cpu_list: "4-7\n"
    /sys/devices/system/cpu/cpu5/node1: ""
    /sys/devices/system/cpu/cpu5/topology/physical_package_id: "1\n"
    /sys/devices/system/cpu/cpu5/topology/core_id: "1\n"
    /sys/devices/system/cpu/cpu5/topology/cluster_id: "0\n"
    /sys/devices/system/cpu/cpu5/cache/index3/level: "3\n"
    /sys/devices/system/cpu/cpu5/cache/index3/id: "1\n"
    /sys/devices/system/cpu/cpu5/cache/index3/shared_cpu_list: "4-7\n"
    /sys/devices/system/cpu/cpu6/node1: ""
    /sys/devices/system/cpu/cpu6/topology/physical_package_id: "1\n"
    /sys/devices/system/cpu/cpu6/topology/core_id: "2\n"
    /sys/devices/system/cpu/cpu6/topology/cluster_id: "0\n"
    /sys/devices/system/cpu/cpu6/cache/index3/level: "3\n"
    /sys/devices/system/cpu/cpu6/cache/index3/id: "1\n"
    /sys/devices/system/cpu/cpu6/cache/index3/shared_cpu_list: "4-7\n"
    /sys/devices/system/cpu/cpu7/node1: ""
    /sys/devices/system/cpu/cpu7/topology/physical_package_id: "1\n"
    /sys/devices/system/cpu/cpu7/topology/core_id: "3\n"
    /sys/devices/system/cpu/cpu7/topology/cluster_id: "0\n"
    /sys/devices/system/cpu/cpu7/cache/index3/level: "3\n"
    /sys/devices/system/cpu/cpu7/cache/index3/id: "1\n"
    /sys/devices/system/cpu/cpu7/cache/index3/shared_cpu_list: "4-7\n"
