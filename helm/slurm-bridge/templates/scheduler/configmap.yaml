apiVersion: v1
kind: ConfigMap
metadata:
  name: scheduler-config
  namespace: {{ include "slurm-bridge.namespace" . }}
data:
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    # Slurm needs all eligible partition nodes before allocation. With scoring
    # disabled, Kubernetes overrides this target to one feasible node; full scans
    # still depend on SlurmBridge.Filter rejecting every node until allocation.
    percentageOfNodesToScore: 100
    leaderElection:
      leaderElect: {{ .Values.scheduler.leaderElect }}
      resourceNamespace: {{ include "slurm-bridge.namespace" . }}
      resourceName: {{ include "slurm-bridge.scheduler.name" . }}
    profiles:
    - schedulerName: {{ include "slurm-bridge.scheduler.name" . }}
      plugins:
        queueSort:
          enabled:
          - name: 'SlurmBridge'
        preEnqueue:
          enabled:
          - name: 'SchedulingGates'
          {{- if and (eq (include "slurm-bridge.genericWorkload.enabled" .) "true") (eq (include "slurm-bridge.scheduler.supportsWorkloadAPI" .) "true") }}
          - name: 'GangScheduling'
          {{- end }}
        preFilter:
          enabled:
          - name: 'VolumeBinding'
          - name: 'NodeResourcesFit'
          - name: 'SlurmBridge'
        filter:
          enabled:
          - name: 'VolumeBinding'
          - name: 'TaintToleration'
          - name: 'NodeResourcesFit'
          - name: 'SlurmBridge'
        postFilter:
          enabled:
          - name: 'SlurmBridge'
        {{- if and (eq (include "slurm-bridge.genericWorkload.enabled" .) "true") (eq (include "slurm-bridge.scheduler.supportsWorkloadAPI" .) "true") }}
        podGroupPostFilter:
          enabled:
          - name: 'SlurmBridge'
        {{- end }}
        reserve:
          enabled:
          - name: 'VolumeBinding'
        preBind:
          enabled:
          - name: 'VolumeBinding'
          - name: 'SlurmBridge'
        bind:
          enabled:
          - name: 'DefaultBinder'
        multiPoint:
          disabled:
          - name: '*'
      pluginConfig:
      - name: SlurmBridge
