{{- $controllers := list "node" "registration" }}
{{- if hasKey .Values.scheduler "controllers" }}
{{- $controllers = .Values.scheduler.controllers }}
{{- end }}
{{- $logLevel := .Values.scheduler.verbosity | default "info" | toString }}

{{- range $controllers }}
{{- if not (has . (list "node" "registration")) }}
{{- fail (printf "unknown controller %q: supported controllers are node,registration" .) }}
{{- end }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "slurm-bridge.scheduler.labels" . | nindent 4 }}
  name: {{ include "slurm-bridge.scheduler.name" . }}
  namespace: {{ include "slurm-bridge.namespace" . }}
spec:
  selector:
    matchLabels:
      {{- include "slurm-bridge.scheduler.selectorLabels" . | nindent 6 }}
  replicas: {{ .Values.scheduler.replicaCount }}
  template:
    metadata:
      labels:
        {{- include "slurm-bridge.scheduler.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/scheduler-config: {{ include (print $.Template.BasePath "/scheduler/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.scheduler.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      serviceAccountName: {{ include "slurm-bridge.scheduler.name" . }}
      containers:
      - args:
        - --scheduler-config=/etc/kubernetes/scheduler-config.yaml
        - --scheduler-feature-gates={{ include "slurm-bridge.scheduler.featureGates" . }}
        - --leader-elect=true
        - --metrics-secure=true
        - --controllers={{ join "," $controllers }}
        - --zap-log-level={{ ternary "info" $logLevel (eq $logLevel "0") }}
        {{- with .Values.scheduler.registrationWorkers }}
        - --registration-workers={{ . }}
        {{- end }}
        {{- with .Values.scheduler.podWorkers }}
        - --pod-workers={{ . }}
        {{- end }}
        env:
        - name: SLURM_JWT_FILE
          value: /var/run/secrets/slurm/auth-token
        image: {{ include "slurm-bridge.scheduler.imageRef" . }}
        imagePullPolicy: {{ .Values.scheduler.image.pullPolicy }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
        name: scheduler
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
        {{- with .Values.scheduler.resources }}
        resources: {{- toYaml . | nindent 10 }}
        {{- end }}
        securityContext:
          privileged: false
        volumeMounts:
        - name: scheduler-config
          mountPath: /etc/kubernetes
          readOnly: true
        - name: slurm-bridge-config
          mountPath: /etc/slurm-bridge/
          readOnly: true
        - name: slurm-jwt
          mountPath: /var/run/secrets/slurm
          readOnly: true
      hostNetwork: false
      hostPID: false
      {{- with .Values.scheduler.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: scheduler-config
        configMap:
          name: scheduler-config
      - name: slurm-bridge-config
        configMap:
          name: slurm-bridge-config
      - name: slurm-jwt
        secret:
          secretName: {{ include "slurm-bridge.slurmJwtSecret.name" . | quote }}
          items:
          - key: {{ include "slurm-bridge.slurmJwtSecret.key" . | quote }}
            path: auth-token
