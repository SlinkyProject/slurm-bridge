{{- if .Values.upgradeHook.enabled }}
{{- $name := printf "%s-pre-upgrade" (include "slurm-bridge.fullname" . | trunc 51 | trimSuffix "-") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-kubeconfig
  namespace: {{ include "slurm-bridge.namespace" . }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: in-cluster
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: hook
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: in-cluster
        context:
          cluster: in-cluster
          user: hook
          namespace: {{ include "slurm-bridge.namespace" . }}
    current-context: in-cluster
{{- end }}
