{{- if .Values.upgradeHook.enabled }}
{{- $name := printf "%s-pre-upgrade" (include "slurm-bridge.fullname" . | trunc 51 | trimSuffix "-") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-kubeconfig
  namespace: {{ include "slurm-bridge.namespace" . }}
  labels:
    {{- include "slurm-bridge.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  # kubectl v1.36.0 skips the in-cluster credential fallback when a nonzero
  # --request-timeout is set. Supply the projected service account explicitly.
  # This endpoint requires cluster DNS, unlike the in-cluster default that uses
  # KUBERNETES_SERVICE_HOST and KUBERNETES_SERVICE_PORT.
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: in-cluster
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: hook
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: in-cluster
        context:
          cluster: in-cluster
          user: hook
          namespace: {{ include "slurm-bridge.namespace" . }}
    current-context: in-cluster
{{- end }}
