{{- if .Values.admission.enabled }}
{{- $name := printf "%s-pod-scheduling" (include "slurm-bridge.admission.fullname" .) }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "slurm-bridge.admission.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE"]
  matchConditions:
    - name: scheduler-name
      expression: 'object.spec.schedulerName == {{ include "slurm-bridge.scheduler.name" . | quote }}'
  validations:
    - expression: "!has(object.spec.nodeName) || object.spec.nodeName == ''"
      message: "spec.nodeName bypasses Slurm scheduling. Use a Slurm partition or constraint for placement."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "slurm-bridge.admission.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: [{{ ternary "Deny" "Warn" .Values.admission.strictPodValidation }}]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - {{ include "slurm-bridge.namespace" . }}
{{- end }}
