{{- if .Values.admission.enabled }}
{{- $certNamespacedName := printf "%s/%s" (include "slurm-bridge.namespace" .) (include "slurm-bridge.admission.name" .) -}}
{{- if and .Values.admission.certManager.enabled (or .Values.admission.tls.existingSecret .Values.admission.tls.caBundle) -}}
{{- fail "admission.tls requires admission.certManager.enabled=false, because cert-manager issues the serving certificate and injects its own CA" -}}
{{- end }}
{{- $caBundle := .Values.admission.tls.caBundle -}}
{{- if and (not .Values.admission.certManager.enabled) (not .Values.admission.tls.existingSecret) }}
{{- $name := include "slurm-bridge.admission.name" . -}}
{{- $namespace := include "slurm-bridge.namespace" . -}}
{{- /* Reuse the certificate already in the cluster, so that repeated renders
       neither rotate the webhook trust nor drift against the live Secret.
       `lookup` yields nothing without a cluster connection (`helm template`),
       in which case a fresh certificate is issued. */}}
{{- $existing := (lookup "v1" "Secret" $namespace $name).data | default dict -}}
{{- $tlsCrt := index $existing "tls.crt" | default "" -}}
{{- $tlsKey := index $existing "tls.key" | default "" -}}
{{- $caCrt := index $existing "ca.crt" | default "" -}}
{{- if not (and $tlsCrt $tlsKey $caCrt) -}}
{{- $durationDays := int 3650 -}}
{{- $dnsList := list (printf "%s.%s" $name $namespace) (printf "%s.%s.svc" $name $namespace) -}}
{{- $ca := genCA $name $durationDays -}}
{{- $cert := genSignedCert $name nil $dnsList $durationDays $ca -}}
{{- $tlsCrt = $cert.Cert | b64enc -}}
{{- $tlsKey = $cert.Key | b64enc -}}
{{- $caCrt = $ca.Cert | b64enc -}}
{{- end }}
{{- $caBundle = $caCrt -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "slurm-bridge.admission.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $tlsCrt | quote }}
  tls.key: {{ $tlsKey | quote }}
  ca.crt: {{ $caCrt | quote }}
{{- end }}{{- /* if self-signed certificate */}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "slurm-bridge.admission.name" . }}
  {{- if .Values.admission.certManager.enabled }}
  annotations:
    certmanager.k8s.io/inject-ca-from: {{ $certNamespacedName | quote }}
    cert-manager.io/inject-ca-from: {{ $certNamespacedName | quote }}
  {{- end }}{{- /* if .Values.admission.certManager.enabled */}}
  labels:
    {{- include "slurm-bridge.admission.labels" . | nindent 4 }}
webhooks:
  {{- if or .Values.admission.managedNamespaceSelector .Values.admission.managedNamespaces }}
  - name: pods.namespaces.slinky.slurm.net
    namespaceSelector:
      {{- if .Values.admission.managedNamespaceSelector }}
      {{- with .Values.admission.managedNamespaceSelector.matchLabels }}
      matchLabels:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      matchExpressions:
        {{- if .Values.admission.managedNamespaceSelector }}
        {{- with .Values.admission.managedNamespaceSelector.matchExpressions }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- else }}
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            {{- toYaml .Values.admission.managedNamespaces | nindent 12 }}
        {{- end }}
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - {{ include "slurm-bridge.namespace" . }}
    matchConditions:
      - name: scheduler-name
        expression: 'object.spec.schedulerName != {{ include "slurm-bridge.scheduler.name" . | quote }}'
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods", "pods/resize"]
        operations: ["CREATE", "UPDATE"]
        scope: Namespaced
    clientConfig:
      {{- with $caBundle }}
      caBundle: {{ . | quote }}
      {{- end }}{{- /* with $caBundle */}}
      service:
        namespace: {{ include "slurm-bridge.namespace" . }}
        name: {{ include "slurm-bridge.admission.name" . }}
        path: /validate--v1-pod
    admissionReviewVersions: ["v1"]
    sideEffects: None
  {{- end }}
  - name: pods.scheduler.slinky.slurm.net
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - {{ include "slurm-bridge.namespace" . }}
    matchConditions:
      - name: scheduler-name
        expression: 'object.spec.schedulerName == {{ include "slurm-bridge.scheduler.name" . | quote }}'
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods", "pods/resize"]
        operations: ["CREATE", "UPDATE"]
        scope: Namespaced
    clientConfig:
      {{- with $caBundle }}
      caBundle: {{ . | quote }}
      {{- end }}{{- /* with $caBundle */}}
      service:
        namespace: {{ include "slurm-bridge.namespace" . }}
        name: {{ include "slurm-bridge.admission.name" . }}
        path: /validate--v1-pod
    admissionReviewVersions: ["v1"]
    sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "slurm-bridge.admission.name" . }}
  {{- if .Values.admission.certManager.enabled }}
  annotations:
    certmanager.k8s.io/inject-ca-from: {{ $certNamespacedName | quote }}
    cert-manager.io/inject-ca-from: {{ $certNamespacedName | quote }}
  {{- end }}{{- /* if .Values.admission.certManager.enabled */}}
  labels:
    {{- include "slurm-bridge.admission.labels" . | nindent 4 }}
webhooks:
  - name: pods.scheduler.slinky.slurm.net
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - {{ include "slurm-bridge.namespace" . }}
    matchConditions:
      - name: scheduler-name
        expression: 'object.spec.schedulerName == {{ include "slurm-bridge.scheduler.name" . | quote }}'
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE", "UPDATE"]
        scope: Namespaced
    clientConfig:
      {{- with $caBundle }}
      caBundle: {{ . | quote }}
      {{- end }}{{- /* with $caBundle */}}
      service:
        namespace: {{ include "slurm-bridge.namespace" . }}
        name: {{ include "slurm-bridge.admission.name" . }}
        path: /mutate--v1-pod
    admissionReviewVersions: ["v1"]
    sideEffects: None
  {{- if or .Values.admission.managedNamespaceSelector .Values.admission.managedNamespaces }}
  - name: pods.namespaces.slinky.slurm.net
    namespaceSelector:
      {{- if .Values.admission.managedNamespaceSelector }}
      {{- with .Values.admission.managedNamespaceSelector.matchLabels }}
      matchLabels:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      matchExpressions:
        {{- if .Values.admission.managedNamespaceSelector }}
        {{- with .Values.admission.managedNamespaceSelector.matchExpressions }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- else }}
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            {{- toYaml .Values.admission.managedNamespaces | nindent 12 }}
        {{- end }}
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - {{ include "slurm-bridge.namespace" . }}
    matchConditions:
      - name: scheduler-name
        expression: 'object.spec.schedulerName != {{ include "slurm-bridge.scheduler.name" . | quote }}'
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE", "UPDATE"]
        scope: Namespaced
    clientConfig:
      {{- with $caBundle }}
      caBundle: {{ . | quote }}
      {{- end }}{{- /* with $caBundle */}}
      service:
        namespace: {{ include "slurm-bridge.namespace" . }}
        name: {{ include "slurm-bridge.admission.name" . }}
        path: /mutate--v1-pod
    admissionReviewVersions: ["v1"]
    sideEffects: None
  {{- end }}
{{- end }}{{- /* if .Values.admission.enabled */}}
