{{- if and .Values.admission.enabled (or .Values.admission.managedNamespaceSelector .Values.admission.managedNamespaces) }}
{{- $action := .Values.admission.workloadAnnotationAction }}
{{- if not (has $action (list "Warn" "Deny")) }}
{{- fail "admission.workloadAnnotationAction must be Warn or Deny" }}
{{- end }}
{{- $name := printf "%s-workload-annotations" (include "slurm-bridge.admission.fullname" .) }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "slurm-bridge.admission.labels" . | nindent 4 }}
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        resources: ["jobs"]
        operations: ["CREATE"]
      - apiGroups: ["jobset.x-k8s.io"]
        apiVersions: ["v1alpha2"]
        resources: ["jobsets"]
        operations: ["CREATE"]
      - apiGroups: ["leaderworkerset.x-k8s.io"]
        apiVersions: ["v1"]
        resources: ["leaderworkersets"]
        operations: ["CREATE"]
      - apiGroups: ["scheduling.k8s.io"]
        apiVersions: ["v1alpha2", "v1alpha3", "v1beta1"]
        resources: ["podgroups", "compositepodgroups", "workloads"]
        operations: ["CREATE"]
      - apiGroups: ["scheduling.x-k8s.io"]
        apiVersions: ["v1alpha1"]
        resources: ["podgroups"]
        operations: ["CREATE"]
  validations:
    - expression: "!has(object.metadata.annotations) || !object.metadata.annotations.exists(key, key.startsWith('slurmjob.slinky.slurm.net/'))"
      message: "Top-level slurmjob.slinky.slurm.net/* workload annotations are deprecated; put them on Pods through Pod template metadata.annotations. Pod annotations take precedence."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "slurm-bridge.admission.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: [{{ $action | quote }}]
  matchResources:
    namespaceSelector:
      {{- with .Values.admission.managedNamespaceSelector }}
      {{- with .matchLabels }}
      matchLabels:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      matchExpressions:
        {{- if .Values.admission.managedNamespaceSelector }}
        {{- with .Values.admission.managedNamespaceSelector.matchExpressions }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- else }}
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            {{- toYaml .Values.admission.managedNamespaces | nindent 12 }}
        {{- end }}
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - {{ include "slurm-bridge.namespace" . }}
{{- end }}
