---
suite: test upgrade shutdown
templates:
  - upgrade/job.yaml
  - upgrade/rbac.yaml
release:
  name: test-release
  namespace: test-namespace
tests:
  - it: only runs before upgrades and retains failed hook resources
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
  - it: disables all hook resources for workflows with their own shutdown
    set:
      upgradeHook.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: bounds shutdown and does not depend on the bridge scheduler
    template: upgrade/job.yaml
    asserts:
      - equal:
          path: spec.activeDeadlineSeconds
          value: 300
      - equal:
          path: spec.backoffLimit
          value: 0
      - equal:
          path: spec.template.spec.schedulerName
          value: default-scheduler
      - equal:
          path: spec.template.spec.serviceAccountName
          value: test-release-slurm-bridge-pre-upgrade
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: pre-upgrade
  - it: scales and observes deployments before waiting for pod deletion without a shell
    template: upgrade/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: scale-down
      - contains:
          path: spec.template.spec.initContainers[1].args
          content: --replicas=0
      - equal:
          path: spec.template.spec.initContainers[2].name
          value: wait-for-deployments
      - contains:
          path: spec.template.spec.initContainers[2].args
          content: --for=condition=Available
      - contains:
          path: spec.template.spec.initContainers[2].args
          content: --for=jsonpath={.spec.replicas}=0
      - contains:
          path: spec.template.spec.containers[0].args
          content: --for=delete
      - equal:
          path: spec.template.spec.containers[0].command
          value: [kubectl]
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.k8s.io/kubectl:v1.36.0
  - it: targets existing components even when admission is being disabled or names change
    template: upgrade/job.yaml
    set:
      admission.enabled: false
      nameOverride: renamed
      namespaceOverride: custom-namespace
      schedulerConfig.schedulerName: custom-scheduler
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-namespace
      - contains:
          path: spec.template.spec.initContainers[1].args
          content: --namespace=custom-namespace
      - contains:
          path: spec.template.spec.initContainers[1].args
          content: --selector=app.kubernetes.io/instance=test-release,app.kubernetes.io/component in (scheduler,controllers,admission)
      - contains:
          path: spec.template.spec.initContainers[2].args
          content: --namespace=custom-namespace
      - contains:
          path: spec.template.spec.initContainers[2].args
          content: --selector=app.kubernetes.io/instance=test-release,app.kubernetes.io/component in (scheduler,controllers,admission)
      - contains:
          path: spec.template.spec.containers[0].args
          content: --namespace=custom-namespace
      - contains:
          path: spec.template.spec.containers[0].args
          content: --selector=app.kubernetes.io/instance=test-release,app.kubernetes.io/component in (scheduler,controllers,admission)
  - it: creates namespace permissions before the job with matching identities
    template: upgrade/rbac.yaml
    set:
      upgradeHook.skipPendingCheck: true
      fullnameOverride: custom-bridge
      namespaceOverride: custom-namespace
    asserts:
      - equal:
          path: metadata.name
          value: custom-bridge-pre-upgrade
      - equal:
          path: metadata.namespace
          value: custom-namespace
      - documentIndex: 0
        equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-30"
      - documentIndex: 1
        equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-20"
      - documentIndex: 2
        equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"
      - documentIndex: 2
        equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: custom-bridge-pre-upgrade
      - documentIndex: 2
        equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: custom-bridge-pre-upgrade
              namespace: custom-namespace
  - it: limits permissions to reading deployments and pods and scaling deployments
    template: upgrade/rbac.yaml
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [apps]
              resources: [deployments]
              verbs: [get, list, watch]
            - apiGroups: [apps]
              resources: [deployments/scale]
              verbs: [get, patch, update]
            - apiGroups: [""]
              resources: [pods]
              verbs: [get, list, watch]
  - it: allows configuring the hook image deadline and placement
    template: upgrade/job.yaml
    set:
      upgradeHook:
        image:
          repository: registry.example.com/kubectl
          tag: v1.36.1
          pullPolicy: Always
        activeDeadlineSeconds: 600
        nodeSelector:
          pool: system
        tolerations:
          - key: system
            operator: Exists
        resources:
          requests:
            cpu: 100m
    asserts:
      - equal:
          path: spec.activeDeadlineSeconds
          value: 600
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/kubectl:v1.36.1
      - equal:
          path: spec.template.spec.initContainers[1].image
          value: registry.example.com/kubectl:v1.36.1
      - equal:
          path: spec.template.spec.initContainers[2].image
          value: registry.example.com/kubectl:v1.36.1
      - contains:
          path: spec.template.spec.initContainers[1].args
          content: --timeout=600s
      - contains:
          path: spec.template.spec.initContainers[2].args
          content: --timeout=600s
      - contains:
          path: spec.template.spec.containers[0].args
          content: --timeout=600s
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            pool: system
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: system
              operator: Exists
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
  - it: checks pending Pods in all namespaces before scaling any deployments
    template: upgrade/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: check-pending-workloads
      - equal:
          path: spec.template.spec.initContainers[0].command
          value: [kubectl]
      - equal:
          path: spec.template.spec.initContainers[0].args
          value:
            - wait
            - pods
            - --all-namespaces
            - --for=delete
            - --timeout=0s
            - --field-selector=spec.schedulerName=slurm-bridge-scheduler,status.phase=Pending
            - --cache-dir=/tmp/kubectl-cache
  - it: checks the configured scheduler without requiring job labels
    template: upgrade/job.yaml
    set:
      schedulerConfig.schedulerName: custom-scheduler
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].args
          content: --field-selector=spec.schedulerName=custom-scheduler,status.phase=Pending
  - it: skips only the pending check and retains the shutdown sequence
    template: upgrade/job.yaml
    set:
      upgradeHook.skipPendingCheck: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: scale-down
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: wait-for-deployments
      - equal:
          path: spec.template.spec.containers[0].name
          value: wait-for-pods
  - it: grants only cluster-wide Pod reads for the pending check
    template: upgrade/rbac.yaml
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [pods]
              verbs: [get, list]
      - equal:
          path: metadata.name
          value: test-namespace-test-release-slurm-bridge-pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-20"
  - it: binds the cluster read permissions to the hook in the overridden namespace
    template: upgrade/rbac.yaml
    set:
      namespaceOverride: custom-namespace
    documentSelector:
      path: kind
      value: ClusterRoleBinding
    asserts:
      - equal:
          path: metadata.name
          value: custom-namespace-test-release-slurm-bridge-pre-upgrade
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: custom-namespace-test-release-slurm-bridge-pre-upgrade
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: test-release-slurm-bridge-pre-upgrade
              namespace: custom-namespace
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"
  - it: omits the cluster read permissions when the check is skipped
    template: upgrade/rbac.yaml
    set:
      upgradeHook.skipPendingCheck: true
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - isKind:
          of: Role
        documentIndex: 1
      - isKind:
          of: RoleBinding
        documentIndex: 2
