---
suite: test upgrade shutdown
templates:
  - upgrade/job.yaml
  - upgrade/rbac.yaml
release:
  name: test-release
  namespace: test-namespace
tests:
  - it: only runs before upgrades and retains failed hook resources
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
  - it: disables all hook resources for workflows with their own shutdown
    set:
      upgradeHook.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: bounds shutdown and does not depend on the bridge scheduler
    template: upgrade/job.yaml
    asserts:
      - equal:
          path: spec.activeDeadlineSeconds
          value: 300
      - equal:
          path: spec.backoffLimit
          value: 0
      - equal:
          path: spec.template.spec.schedulerName
          value: default-scheduler
      - equal:
          path: spec.template.spec.serviceAccountName
          value: test-release-slurm-bridge-pre-upgrade
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: pre-upgrade
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'scale deployments.*--replicas=0'
  - it: targets existing components even when admission is being disabled or names change
    template: upgrade/job.yaml
    set:
      admission.enabled: false
      nameOverride: renamed
      namespaceOverride: custom-namespace
      schedulerConfig.schedulerName: custom-scheduler
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-namespace
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: BRIDGE_NAMESPACE
              value: custom-namespace
            - name: BRIDGE_SELECTOR
              value: app.kubernetes.io/instance=test-release,app.kubernetes.io/component in (scheduler,controllers,admission)
  - it: creates namespace permissions before the job with matching identities
    template: upgrade/rbac.yaml
    set:
      fullnameOverride: custom-bridge
      namespaceOverride: custom-namespace
    asserts:
      - equal:
          path: metadata.name
          value: custom-bridge-pre-upgrade
      - equal:
          path: metadata.namespace
          value: custom-namespace
      - documentIndex: 0
        equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-30"
      - documentIndex: 1
        equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-20"
      - documentIndex: 2
        equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"
      - documentIndex: 2
        equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: custom-bridge-pre-upgrade
      - documentIndex: 2
        equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: custom-bridge-pre-upgrade
              namespace: custom-namespace
  - it: limits permissions to reading deployments and pods and scaling deployments
    template: upgrade/rbac.yaml
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [apps]
              resources: [deployments]
              verbs: [get, list]
            - apiGroups: [apps]
              resources: [deployments/scale]
              verbs: [get, patch, update]
            - apiGroups: [""]
              resources: [pods]
              verbs: [list]
  - it: allows configuring the hook image deadline and placement
    template: upgrade/job.yaml
    set:
      upgradeHook:
        image:
          repository: registry.example.com/kubectl
          tag: v1.36.1
          pullPolicy: Always
        activeDeadlineSeconds: 600
        nodeSelector:
          pool: system
        tolerations:
          - key: system
            operator: Exists
        resources:
          requests:
            cpu: 100m
    asserts:
      - equal:
          path: spec.activeDeadlineSeconds
          value: 600
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/kubectl:v1.36.1
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            pool: system
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: system
              operator: Exists
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
