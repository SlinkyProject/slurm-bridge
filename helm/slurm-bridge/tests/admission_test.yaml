---
suite: test admission
templates:
  - admission/deployment.yaml
  - admission/rbac.yaml
  - admission/service.yaml
  - admission/webhook.yaml
  - configmap.yaml
release:
  name: test-release
  namespace: test-namespace
chart:
  version: 1.2.3
  appVersion: 1.2.3
tests:
  - it: manifests should match snapshot
    set:
      admission:
        enabled: true
    asserts:
      - matchSnapshot: {}
  - it: deployment carries a config checksum annotation so configmap changes trigger a rolling restart
    template: admission/deployment.yaml
    set:
      admission:
        enabled: true
    asserts:
      - isNotNullOrEmpty:
          path: spec.template.metadata.annotations["checksum/config"]
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[0-9a-f]{64}$
  - it: image pull policy is configurable
    template: admission/deployment.yaml
    set:
      admission:
        enabled: true
        image:
          pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
  - it: applies the admission resources to the admission container
    template: admission/deployment.yaml
    set:
      admission:
        enabled: true
        resources:
          requests:
            cpu: 1
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 1
              memory: 1Gi
            limits:
              cpu: 2
              memory: 4Gi
  - it: does not apply the controllers resources to the admission container
    template: admission/deployment.yaml
    set:
      admission.enabled: true
      controllers.resources:
        limits:
          cpu: 9
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].resources
