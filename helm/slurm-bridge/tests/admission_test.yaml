---
suite: test admission
templates:
  - admission/deployment.yaml
  - admission/poddisruptionbudget.yaml
  - admission/rbac.yaml
  - admission/service.yaml
  - admission/webhook.yaml
  - configmap.yaml
release:
  name: test-release
  namespace: test-namespace
chart:
  version: 1.2.3
  appVersion: 1.2.3
kubernetesProvider:
  scheme:
    "v1/Secret":
      gvr:
        version: v1
        resource: secrets
      namespaced: true
  objects: []
tests:
  - it: manifests should match snapshot
    set:
      admission:
        enabled: true
    asserts:
      - matchSnapshot: {}
  - it: deployment carries a config checksum annotation so configmap changes trigger a rolling restart
    template: admission/deployment.yaml
    set:
      admission:
        enabled: true
    asserts:
      - isNotNullOrEmpty:
          path: spec.template.metadata.annotations["checksum/config"]
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[0-9a-f]{64}$
  - it: image pull policy is configurable
    template: admission/deployment.yaml
    set:
      admission:
        enabled: true
        image:
          pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
  - it: exposes metrics over HTTP
    template: admission/service.yaml
    set:
      admission.enabled: true
    asserts:
      - contains:
          path: spec.ports
          content:
            name: metrics
            protocol: TCP
            port: 8080
            targetPort: 8080
  - it: applies the admission resources to the admission container
    template: admission/deployment.yaml
    set:
      admission:
        enabled: true
        resources:
          requests:
            cpu: 1
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 1
              memory: 1Gi
            limits:
              cpu: 2
              memory: 4Gi
  - it: does not apply the controllers resources to the admission container
    template: admission/deployment.yaml
    set:
      admission.enabled: true
      controllers.resources:
        limits:
          cpu: 9
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].resources
  - it: pdb is not rendered for a single replica, which would block node drains
    template: admission/poddisruptionbudget.yaml
    set:
      admission:
        enabled: true
        replicas: 1
        pdb:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0
  - it: pdb defaults to minAvailable when maxUnavailable is unset
    template: admission/poddisruptionbudget.yaml
    set:
      admission:
        enabled: true
        replicas: 2
        pdb:
          enabled: true
    asserts:
      - equal:
          path: spec.minAvailable
          value: 1
      - notExists:
          path: spec.maxUnavailable
  - it: pdb maxUnavailable takes precedence over minAvailable
    template: admission/poddisruptionbudget.yaml
    set:
      admission:
        enabled: true
        replicas: 2
        pdb:
          enabled: true
          maxUnavailable: 1
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable
  - it: cert-manager injects the CA, so no caBundle is written into the webhook configurations
    template: admission/webhook.yaml
    set:
      admission:
        enabled: true
        certManager:
          enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - notExists:
          path: webhooks[0].clientConfig.caBundle
  - it: falls back to managed namespaces when the namespace selector is empty
    template: admission/webhook.yaml
    set:
      admission:
        enabled: true
        managedNamespaceSelector: {}
        managedNamespaces:
          - managed-one
          - managed-two
      schedulerConfig.schedulerName: my-scheduler
    asserts:
      - documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
        equal:
          path: webhooks[0].namespaceSelector.matchExpressions[0]
          value:
            key: kubernetes.io/metadata.name
            operator: In
            values:
              - managed-one
              - managed-two
      - documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
        equal:
          path: webhooks[0].matchConditions[0].expression
          value: object.spec.schedulerName != "my-scheduler"
      - documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
        equal:
          path: webhooks[1].matchConditions[0].expression
          value: object.spec.schedulerName == "my-scheduler"
      - documentSelector:
          path: kind
          value: MutatingWebhookConfiguration
        equal:
          path: webhooks[1].namespaceSelector.matchExpressions[0]
          value:
            key: kubernetes.io/metadata.name
            operator: In
            values:
              - managed-one
              - managed-two
      - documentSelector:
          path: kind
          value: MutatingWebhookConfiguration
        equal:
          path: webhooks[1].matchConditions[0].expression
          value: object.spec.schedulerName != "my-scheduler"
      - documentSelector:
          path: kind
          value: MutatingWebhookConfiguration
        equal:
          path: webhooks[0].matchConditions[0].expression
          value: object.spec.schedulerName == "my-scheduler"
  - it: omits namespace webhooks when no managed namespaces are configured
    template: admission/webhook.yaml
    set:
      admission.enabled: true
      admission.managedNamespaces: []
    asserts:
      - documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
        lengthEqual:
          path: webhooks
          count: 1
      - documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
        equal:
          path: webhooks[0].name
          value: pods.scheduler.slinky.slurm.net
      - documentSelector:
          path: kind
          value: MutatingWebhookConfiguration
        lengthEqual:
          path: webhooks
          count: 1
      - documentSelector:
          path: kind
          value: MutatingWebhookConfiguration
        equal:
          path: webhooks[0].name
          value: pods.scheduler.slinky.slurm.net
  - it: uses the managed namespace label selector for both admission configurations
    template: admission/webhook.yaml
    set:
      admission.enabled: true
      admission.managedNamespaceSelector:
        matchLabels:
          slinky.slurm.net/managed: "true"
        matchExpressions:
          - key: workload
            operator: In
            values:
              - batch
    asserts:
      - documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
        equal:
          path: webhooks[0].namespaceSelector.matchLabels
          value:
            slinky.slurm.net/managed: "true"
      - documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
        equal:
          path: webhooks[0].namespaceSelector.matchExpressions[0]
          value:
            key: workload
            operator: In
            values:
              - batch
      - documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
        equal:
          path: webhooks[0].namespaceSelector.matchExpressions[1]
          value:
            key: kubernetes.io/metadata.name
            operator: NotIn
            values:
              - kube-system
              - test-namespace
      - documentSelector:
          path: kind
          value: MutatingWebhookConfiguration
        equal:
          path: webhooks[1].namespaceSelector.matchLabels
          value:
            slinky.slurm.net/managed: "true"
  - it: the self-signed path issues a certificate Secret and trusts it in both webhook configurations
    template: admission/webhook.yaml
    set:
      admission:
        enabled: true
        certManager:
          enabled: false
    asserts:
      - hasDocuments:
          count: 3
      - documentSelector:
          path: kind
          value: Secret
        isNotNullOrEmpty:
          path: data["tls.crt"]
      - documentSelector:
          path: kind
          value: Secret
        isNotNullOrEmpty:
          path: data["tls.key"]
      - documentSelector:
          path: kind
          value: Secret
        isNotNullOrEmpty:
          path: data["ca.crt"]
      - documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
        isNotNullOrEmpty:
          path: webhooks[0].clientConfig.caBundle
      - documentSelector:
          path: kind
          value: MutatingWebhookConfiguration
        isNotNullOrEmpty:
          path: webhooks[0].clientConfig.caBundle
  - it: the self-signed path reuses the certificate already in the cluster
    template: admission/webhook.yaml
    kubernetesProvider:
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: slurm-bridge-admission
            namespace: test-namespace
          type: kubernetes.io/tls
          data:
            tls.crt: aW4tY2x1c3Rlci1jZXJ0
            tls.key: aW4tY2x1c3Rlci1rZXk=
            ca.crt: aW4tY2x1c3Rlci1jYQ==
    set:
      admission:
        enabled: true
        certManager:
          enabled: false
    asserts:
      - documentSelector:
          path: kind
          value: Secret
        equal:
          path: data["tls.crt"]
          value: aW4tY2x1c3Rlci1jZXJ0
      - documentSelector:
          path: kind
          value: Secret
        equal:
          path: data["tls.key"]
          value: aW4tY2x1c3Rlci1rZXk=
      - documentSelector:
          path: kind
          value: Secret
        equal:
          path: data["ca.crt"]
          value: aW4tY2x1c3Rlci1jYQ==
      - documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
        equal:
          path: webhooks[0].clientConfig.caBundle
          value: aW4tY2x1c3Rlci1jYQ==
      - documentSelector:
          path: kind
          value: MutatingWebhookConfiguration
        equal:
          path: webhooks[0].clientConfig.caBundle
          value: aW4tY2x1c3Rlci1jYQ==
  - it: an incomplete certificate Secret in the cluster is reissued rather than reused
    template: admission/webhook.yaml
    kubernetesProvider:
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: slurm-bridge-admission
            namespace: test-namespace
          type: kubernetes.io/tls
          data:
            tls.crt: aW4tY2x1c3Rlci1jZXJ0
    set:
      admission:
        enabled: true
        certManager:
          enabled: false
    asserts:
      - documentSelector:
          path: kind
          value: Secret
        notEqual:
          path: data["tls.crt"]
          value: aW4tY2x1c3Rlci1jZXJ0
      - documentSelector:
          path: kind
          value: Secret
        isNotNullOrEmpty:
          path: data["tls.key"]
  - it: an externally managed certificate is trusted verbatim and no Secret is issued
    template: admission/webhook.yaml
    set:
      admission:
        enabled: true
        certManager:
          enabled: false
        tls:
          existingSecret: my-webhook-cert
          caBundle: bXktY2EtYnVuZGxl
    asserts:
      - hasDocuments:
          count: 2
      - documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
        equal:
          path: webhooks[0].clientConfig.caBundle
          value: bXktY2EtYnVuZGxl
      - documentSelector:
          path: kind
          value: MutatingWebhookConfiguration
        equal:
          path: webhooks[0].clientConfig.caBundle
          value: bXktY2EtYnVuZGxl
  - it: the admission pod serves from the externally managed certificate Secret
    template: admission/deployment.yaml
    set:
      admission:
        enabled: true
        certManager:
          enabled: false
        tls:
          existingSecret: my-webhook-cert
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: certificates
            secret:
              defaultMode: 420
              secretName: my-webhook-cert
  - it: rejects an externally managed Secret while cert-manager owns the certificate
    template: admission/webhook.yaml
    set:
      admission:
        enabled: true
        certManager:
          enabled: true
        tls:
          existingSecret: my-webhook-cert
    asserts:
      - failedTemplate:
          errorPattern: admission.tls requires admission.certManager.enabled=false
  - it: rejects an externally supplied caBundle while cert-manager injects its own
    template: admission/webhook.yaml
    set:
      admission:
        enabled: true
        certManager:
          enabled: true
        tls:
          caBundle: bXktY2EtYnVuZGxl
    asserts:
      - failedTemplate:
          errorPattern: admission.tls requires admission.certManager.enabled=false
  - it: the admission ClusterRole is release-scoped and carries no namespace
    template: admission/rbac.yaml
    set:
      admission.enabled: true
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - equal:
          path: metadata.name
          value: test-release-slurm-bridge-admission
      - notExists:
          path: metadata.namespace
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: admission
  - it: the admission ClusterRoleBinding binds the release-scoped ClusterRole to the admission account
    template: admission/rbac.yaml
    set:
      admission.enabled: true
    documentSelector:
      path: kind
      value: ClusterRoleBinding
    asserts:
      - equal:
          path: metadata.name
          value: test-release-slurm-bridge-admission
      - equal:
          path: roleRef.name
          value: test-release-slurm-bridge-admission
      - equal:
          path: subjects[0].name
          value: slurm-bridge-admission
  - it: does not expose the Slurm JWT to admission
    template: admission/deployment.yaml
    set:
      admission:
        enabled: true
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].env
