suite: bridge pod scheduling policy
templates:
  - admission/pod-scheduling-policy.yaml
release:
  name: test-release
  namespace: slinky
tests:
  - it: denies unsupported requests on pod creation by default
    asserts:
      - equal:
          path: spec.matchConstraints.resourceRules
          value:
            - apiGroups: [""]
              apiVersions: ["v1"]
              resources: ["pods"]
              operations: ["CREATE"]
        documentIndex: 0
      - equal:
          path: spec.validationActions
          value: [Deny]
        documentIndex: 1
      - equal:
          path: spec.matchResources.namespaceSelector.matchExpressions
          value:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values: [kube-system, slinky]
        documentIndex: 1
  - it: denies unsupported requests when upgrading with values that omit strictPodValidation
    set:
      admission.strictPodValidation: null
    asserts:
      - equal:
          path: spec.validationActions
          value: [Deny]
        documentIndex: 1
  - it: warns for pods explicitly selecting the bridge even without managed namespaces
    set:
      admission.strictPodValidation: false
      admission.managedNamespaces: []
      schedulerConfig.schedulerName: custom-bridge
    asserts:
      - equal:
          path: spec.matchConditions[0].expression
          value: 'object.spec.schedulerName == "custom-bridge"'
        documentIndex: 0
      - equal:
          path: spec.validationActions
          value: [Warn]
        documentIndex: 1
  - it: omits the policy and binding when admission is disabled
    set:
      admission.enabled: false
    asserts:
      - hasDocuments:
          count: 0
